[project]
name = "cammcut"
version = "0.2.0"
description = "SVG to CAMM-GL III cutter for Roland CAMM-1 (CX-24), CLI and LAN web app"
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.12"
dependencies = [
    "svgelements>=1.9",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "python-multipart>=0.0.9",
    "pillow>=10",
    "fonttools>=4.53",
    "httpx>=0.27",
]

[project.optional-dependencies]
tidy = ["shapely>=2"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
cammcut = "cammcut.cammcut:main"

[project.urls]
Homepage = "https://github.com/GlassOnTin/cammcut"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cammcut"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
# correctness + import sorting; the original CLI's % formatting stays
select = ["E4", "E7", "E9", "F", "I", "B"]